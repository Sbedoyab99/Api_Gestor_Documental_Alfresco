spring.application.name=demo
spring.config.import=optional:file:.env.dev[.properties]

# Alfresco connection. Override these values with environment variables outside local development.
alfresco.base-url=${ALFRESCO_BASE_URL:http://localhost:8081}
alfresco.username=${ALFRESCO_USERNAME}
alfresco.password=${ALFRESCO_PASSWORD}
alfresco.connectionTimeout=${ALFRESCO_CONNECTION_TIMEOUT:3s}
alfresco.readTimeout=${ALFRESCO_READ_TIMEOUT:5s}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
